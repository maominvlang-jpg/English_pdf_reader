<body class="bg-gray-50 flex flex-col items-center p-4 min-h-screen font-sans">

    <div class="w-full max-w-7xl space-y-6">
        <!-- 头部/标题 -->
        <h1 class="text-3xl font-bold text-gray-800 text-center mt-4">
            📚 英语课本pdf音频文本提取工具
        </h1>
        <p class="text-center text-sm text-gray-500">
            PDF 页面加载后，点击【识别/翻译】按钮开始 OCR 识别与翻译。识别完成后，您可以点击右侧英文文本块来播放音频，或拖拽以改变句子的顺序。
        </p>

        <!-- 文件上传和控制区 -->
        <div id="controls" class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex flex-col space-y-5">
            
            <!-- 第一行：OpenRouter 配置 -->
            <div id="openrouter-config" class="w-full flex flex-col sm:flex-row items-center gap-3 justify-start border-b border-gray-100 pb-5">
                <div class="flex items-center text-gray-700 font-semibold text-sm w-full sm:w-auto">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2 text-indigo-500"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    API 配置
                </div>
                <input id="openrouter-key-input" type="password" placeholder="OpenRouter API Key（仅保存在本机）" class="flex-1 sm:max-w-sm px-4 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-gray-50 focus:bg-white transition-colors" autocomplete="off">
                <input id="openrouter-model-input" type="text" placeholder="模型（例如 openai/gpt-4o-mini）" class="flex-1 sm:max-w-xs px-4 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-gray-50 focus:bg-white transition-colors" autocomplete="off">
                <button id="openrouter-save-btn" type="button" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold shadow-sm transition-all active:scale-95">
                    保存
                </button>
                <span id="openrouter-status" class="text-xs font-medium px-2.5 py-1 rounded-full bg-gray-100 text-gray-500 sm:ml-2">未配置</span>
            </div>

            <!-- 第二行：操作按钮 -->
            <div class="flex flex-col sm:flex-row flex-wrap items-center justify-between gap-4">
                
                <!-- 左侧：文件操作与分页 -->
                <div class="flex items-center gap-3">
                    <!-- 上传按钮 -->
                    <label for="pdf-file-input" class="cursor-pointer mb-0">
                        <div class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-5 rounded-xl shadow-sm transition-all transform hover:scale-105 active:scale-95 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            选择 PDF
                        </div>
                    </label>
                    <input type="file" id="pdf-file-input" class="hidden" accept="application/pdf" onchange="handleFileUpload(event)">

                    <div class="h-6 w-px bg-gray-200 mx-1 hidden sm:block"></div>

                    <!-- 分页控件 -->
                    <div class="flex items-center bg-gray-50 p-1 rounded-xl border border-gray-200">
                        <button id="prev-btn" onclick="goPrevPage()" class="p-2 text-gray-600 hover:bg-white hover:text-gray-900 hover:shadow-sm rounded-lg disabled:opacity-30 disabled:hover:bg-transparent disabled:hover:shadow-none transition-all" disabled="">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
                        </button>
                        <div id="page-info" class="text-sm font-semibold text-gray-700 px-3 min-w-[4rem] text-center hidden">
                            <span id="current-page-display">1</span> / <span id="total-pages-display">0</span>
                        </div>
                        <button id="next-btn" onclick="goNextPage()" class="p-2 text-gray-600 hover:bg-white hover:text-gray-900 hover:shadow-sm rounded-lg disabled:opacity-30 disabled:hover:bg-transparent disabled:hover:shadow-none transition-all" disabled="">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
                        </button>
                    </div>
                </div>

                <!-- 右侧：功能按钮 -->
                <div class="flex items-center gap-3">
                    <button id="ocr-btn" onclick="runOCR(false)" class="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl shadow-sm disabled:opacity-50 disabled:cursor-not-allowed transition-all font-semibold flex items-center gap-2 active:scale-95" disabled="">            
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"></path><path d="M9 20h6"></path><path d="M12 4v16"></path></svg>
                        识别当前页
                    </button>
                    <button id="bulk-ocr-btn" onclick="runBulkOCR()" class="px-5 py-2.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl shadow-sm disabled:opacity-50 disabled:cursor-not-allowed transition-all font-semibold flex items-center gap-2 active:scale-95" disabled="">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        一键识别全部
                    </button>
                    <button id="export-data-btn" onclick="exportDataXlsx()" class="px-5 py-2.5 bg-gray-900 hover:bg-gray-800 text-white rounded-xl shadow-sm disabled:opacity-50 disabled:cursor-not-allowed transition-all font-semibold flex items-center gap-2 active:scale-95" disabled="">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        生成数据包
                    </button>
                </div>

            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
        <!-- 主内容区域: PDF Viewer (左) + Extracted Text Panel (右) -->
        <div id="main-content-area" class="flex flex-col lg:flex-row gap-6">

            <!-- 左侧区域：PDF Viewer 和 TTS Status -->
            <div class="lg:w-3/5 xl:w-7/12 flex flex-col space-y-4">
                 <!-- 电子书显示区域 -->
                <div id="book-canvas-wrapper" class="w-full bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden p-4">
                    <!-- 加载指示器/初始提示 -->
                    <div id="loading-spinner" class="hidden flex flex-col items-center justify-center p-8 text-gray-500">
                        <svg class="animate-spin h-10 w-10 text-blue-500 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>

        // --- 核心工具函数 (PCM to WAV) ---
        
        /** 将 Base64 字符串转换为 ArrayBuffer */
        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        /** 写入 WAV 文件头的辅助函数 */
        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        /** 将 16位 PCM 音频数据转换为 WAV Blob */
        function pcmToWav(pcm16, sampleRate = 24000) {
            const numChannels = 1;
            const bytesPerSample = 2; // 16-bit PCM
            const blockAlign = numChannels * bytesPerSample;
            const byteRate = sampleRate * blockAlign;

            const buffer = new ArrayBuffer(44 + pcm16.length * bytesPerSample);
            const view = new DataView(buffer);

            // RIFF chunk
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + pcm16.length * bytesPerSample, true);
            writeString(view, 8, 'WAVE');
            
            // FMT chunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); 
            view.setUint16(20, 1, true); 
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, 16, true); 

            // DATA chunk
            writeString(view, 36, 'data');
            view.setUint32(40, pcm16.length * bytesPerSample, true);

            // Write PCM data
            let offset = 44;
            for (let i = 0; i < pcm16.length; i++) {
                view.setInt16(offset, pcm16[i], true);
                offset += bytesPerSample;
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }
        
        // --- 通用 UI/流程 函数 ---
        
        function showError(message) {

        function showLoading() {

                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>正在渲染 PDF...</span>

            `;

        function updateNavigationButtons() {
            if (!pdfDoc) {
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                ocrBtn.disabled = true;
                if (bulkOcrBtn) bulkOcrBtn.disabled = true;
                if (exportDataBtn) exportDataBtn.disabled = true;
                pageInfo.classList.add('hidden');
                return;
            }
            prevBtn.disabled = bulkOcrRunning || currentPage <= 1;
            nextBtn.disabled = bulkOcrRunning || currentPage >= pdfDoc.numPages;
            ocrBtn.disabled = bulkOcrRunning;
            if (bulkOcrBtn) bulkOcrBtn.disabled = bulkOcrRunning;
            if (exportDataBtn) exportDataBtn.disabled = bulkOcrRunning;

            currentPageDisplay.textContent = currentPage;
            totalPagesDisplay.textContent = pdfDoc.numPages;
            pageInfo.classList.remove('hidden');

        async function renderPage(pageNum) {
            if (!pdfDoc) return;
            showLoading();

            try {
                const page = await pdfDoc.getPage(pageNum);
                
                // 计算缩放比例以适应容器
                let containerWidth = document.getElementById('book-canvas-wrapper').clientWidth - 40; 
                // 如果容器隐藏或宽度为0，给一个默认回退宽度
                if (containerWidth <= 0) {
                    containerWidth = window.innerWidth > 768 ? 600 : window.innerWidth - 80;
                }
                const viewport = page.getViewport({ scale: 1 });
                let scale = containerWidth / viewport.width;
                
                // 限制最大缩放比例，防止过大或过小
                if (scale < 0.5) scale = 0.5;
                if (scale > 3) scale = 3;

                const scaledViewport = page.getViewport({ scale: scale });

                canvas.height = scaledViewport.height;
                canvas.width = scaledViewport.width;
                
                canvasWrapper.style.width = `${scaledViewport.width}px`;
                canvasWrapper.style.height = `${scaledViewport.height}px`;


                const renderContext = {
                    canvasContext: ctx,
                    viewport: scaledViewport
                };

                await page.render(renderContext).promise;

                currentPage = pageNum;
                loadingSpinner.classList.add('hidden');
                canvasWrapper.classList.remove('hidden'); 
                updateNavigationButtons();
                
                // 清理旧的 OCR 状态
                clickOverlay.style.width = `${scaledViewport.width}px`;
                clickOverlay.style.height = `${scaledViewport.height}px`;
                clickOverlay.classList.add('hidden');
                clickOverlay.style.pointerEvents = 'none';
                clickOverlay.querySelectorAll('.ocr-marker').forEach(m => m.remove()); // 清除标记
                
                const cached = ocrCacheByPage.get(pageNum);
                if (cached) {
                    ocrData = cached;
                    applyOcrOrder(ocrData);
                    displayOCRText(ocrData);
                } else {
                    ocrData = [];
                    ocrTextPanel.innerHTML = '<p class="text-gray-500 italic">PDF 已渲染完成。点击【识别/翻译】或【一键识别】开始识别与翻译。</p>';
                }
                
                stopPlaybackAndCleanup(); // 切换页面时停止所有播放和高亮

            } catch (error) {
                console.error("渲染 PDF 页面失败:", error);
                showError("渲染 PDF 页面失败: " + error.message);
            }
        }

        window.goToPage = function(pageNum) {
            if (!pdfDoc || pageNum < 1 || pageNum > pdfDoc.numPages || pageNum === currentPage) {
                return;
            }
            renderPage(pageNum);
        };
        
        window.goPrevPage = function() {

        window.handleFileUpload = async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileSizeMB = file.size / (1024 * 1024);
            if (fileSizeMB > MAX_FILE_SIZE_MB) {

            const fileReader = new FileReader();
            fileReader.onload = async function() {

        /**
         * 停止所有播放和清理所有高亮/计时器

        function stopPlaybackAndCleanup() {

        async function openRouterChatCompletion({ messages, model }) {
            const apiKey = getOpenRouterApiKey();
            if (!apiKey) {
                throw new Error('未配置 OpenRouter API Key。请先在顶部输入并保存。');
            }
            const payload = {
                model: model || getOpenRouterModel(),
                messages,
                temperature: 0.2
            };

            for (let retry = 0; retry < MAX_RETRIES; retry++) {
                try {
                    const response = await fetch(`${OPENROUTER_BASE_URL}/chat/completions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`,
                            'HTTP-Referer': window.location.origin,
                            'X-Title': 'English_pdf_reader'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.status === 429 && retry < MAX_RETRIES - 1) {
                        const delay = Math.pow(2, retry) * 1000 + Math.random() * 1000;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        continue;
                    }

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`OpenRouter API failed: ${response.status} - ${errorText}`);
                    }

                    const result = await response.json();
                    const text = result?.choices?.[0]?.message?.content;
                    if (!text) {
                        throw new Error('OpenRouter API 返回为空。');
                    }
                    return text;
                } catch (error) {
                    if (retry === MAX_RETRIES - 1) {
                        throw error;
                    }
                    const delay = Math.pow(2, retry) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
            throw new Error('OpenRouter API 最终调用失败 (未知原因)。');
        }

        function safeJsonParseArray(text) {
            try {
                const data = JSON.parse(text);
                return Array.isArray(data) ? data : null;
            } catch (e) {}
            const start = text.indexOf('[');
            const end = text.lastIndexOf(']');
            if (start !== -1 && end !== -1 && end > start) {
                const slice = text.slice(start, end + 1);
                try {
                    const data = JSON.parse(slice);
                    return Array.isArray(data) ? data : null;
                } catch (e) {}
            }
            return null;
        }

        function sanitizeOcrEnglishText(text) {
            let t = String(text || '');
            t = t.replace(/[\u4E00-\u9FFF]/g, ' ');
            t = t.replace(/[0-9]/g, ' ');
            t = t.replace(/\s+/g, ' ').trim();
            t = t.replace(/^[^A-Za-z]+/, '').replace(/[^A-Za-z]+$/, '').trim();
            if (t.length < 2) return '';
            if (!/[A-Za-z]/.test(t)) return '';
            return t;
        }

        async function callOpenRouterTranslation(text) {
            const messages = [
                { role: 'system', content: 'You are a professional translator.' },
                { role: 'user', content: `把下面英文翻译成自然、简洁的中文，只输出翻译结果，不要加引号或解释：\n\n${text}` }
            ];
            const output = await openRouterChatCompletion({ messages, model: getOpenRouterModel() });
            return output.trim();
        }

        async function callOpenRouterTiming(text) {
            const messages = [
                { role: 'system', content: "You are a text alignment specialist. Break the English text into individual words and estimate plausible start and end times in seconds for each word. Output only a JSON array of objects: {\"word\": string, \"start\": number, \"end\": number}." },
                { role: 'user', content: `Text: ${text}` }
            ];
            const output = await openRouterChatCompletion({ messages, model: getOpenRouterModel() });
            const data = safeJsonParseArray(output);
            if (!data) {
                throw new Error('时间戳生成返回的 JSON 解析失败。');
            }
            return data.filter(item =>
                item && typeof item.word === 'string' &&
                typeof item.start === 'number' &&
                typeof item.end === 'number'
            );
        }

        async function callOpenRouterOCR(base64Image) {
            const dataUrl = `data:image/png;base64,${base64Image}`;
            const messages = [
                {
                    role: 'system',
                    content: 'You are a specialized OCR tool for English. Extract only English words and sentences from the image. Do NOT include digits, Chinese characters, or any non-English text. If a block includes a leading number (like "1."), exclude the number from the returned text. For each block output JSON object with fields: text (string) and bbox (array of 4 numbers [x_min, y_min, x_max, y_max] normalized strictly from 0 to 1000, representing the relative coordinates across the full image width and height, where [0,0] is top-left and [1000,1000] is bottom-right). Output only a JSON array.'
                },
                {
                    role: 'user',
                    content: [
                        { type: 'text', text: 'Extract English text blocks and their normalized bounding boxes from this image.' },
                        { type: 'image_url', image_url: { url: dataUrl } }
                    ]
                }
            ];
            const output = await openRouterChatCompletion({ messages, model: getOpenRouterModel() });
            const data = safeJsonParseArray(output);
            if (!data) {
                throw new Error('OCR 返回的 JSON 解析失败。');
            }
            return data
                .filter(item =>
                    item && typeof item.text === 'string' && item.text.trim().length > 0 &&
                    Array.isArray(item.bbox) && item.bbox.length === 4 &&
                    item.bbox.every(n => typeof n === 'number')
                )
                .map(item => {
                    const cleaned = sanitizeOcrEnglishText(item.text);
                    if (!cleaned) return null;
                    return { text: cleaned, bbox: item.bbox };
                })
                .filter(Boolean);
        }

        function speakWithBrowserTTS(text) {
            if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) {
                throw new Error('当前浏览器不支持本地 TTS。');
            }
            window.speechSynthesis.cancel();
            currentSpeechStartPerfMs = null;
            refreshVoices();

            return new Promise((resolve, reject) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-GB';
                const v = pickBritishVoice();
                if (v) utterance.voice = v;
                utterance.rate = 0.95;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                currentSpeechUtterance = utterance;

                utterance.onstart = () => {
                    currentSpeechStartPerfMs = performance.now();
                };
                utterance.onend = () => {
                    resolve();
                };
                utterance.onerror = () => {
                    reject(new Error('本地 TTS 播放失败。'));
                };
                window.speechSynthesis.speak(utterance);
            });
        }
        
        function pcmToMp3(pcm16, sampleRate = 24000) {
            if (!window.lamejs) {
                throw new Error("lamejs 尚未加载");
            }
            const lamejs = window.lamejs;
            const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
            const mp3Data = [];
            
            const sampleBlockSize = 1152; 
            for (let i = 0; i < pcm16.length; i += sampleBlockSize) {
                const sampleChunk = pcm16.subarray(i, i + sampleBlockSize);
                const mp3buf = mp3encoder.encodeBuffer(sampleChunk);
                if (mp3buf.length > 0) {
                    mp3Data.push(new Int8Array(mp3buf));
                }
            }
            const mp3buf = mp3encoder.flush();
            if (mp3buf.length > 0) {
                mp3Data.push(new Int8Array(mp3buf));
            }
            
            return new Blob(mp3Data, { type: 'audio/mp3' });
        }

        /**
         * 调用 Gemini API 生成音频 Blob (MP3)
         */
        async function generateTtsAudioBlob(text) {
            const TTS_MODEL = 'gemini-2.5-flash-preview-tts';
            const TTS_VOICE = 'Aoede'; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${TTS_MODEL}:generateContent`;

            const payload = {
                contents: [{ parts: [{ text: text }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: { voiceName: TTS_VOICE }
                        }
                    }
                },
            };

            for (let retry = 0; retry < MAX_RETRIES; retry++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.status === 429 && retry < MAX_RETRIES - 1) {
                        const delay = Math.pow(2, retry) * 1000 + Math.random() * 1000;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        continue;
                    }

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`TTS API failed: ${response.status} - ${errorText}`);
                    }

                    const result = await response.json();
                    const part = result?.candidates?.[0]?.content?.parts?.[0];
                    const audioData = part?.inlineData?.data;

                    if (audioData) {
                        const pcmData = base64ToArrayBuffer(audioData);
                        const pcm16 = new Int16Array(pcmData);
                        
                        return pcmToMp3(pcm16, 24000); 
                    } else {
                        throw new Error("TTS API returned invalid audio data structure.");
                    }

                } catch (error) {
                    if (retry === MAX_RETRIES - 1) {
                        throw new Error("TTS API 最终调用失败: " + error.message);
                    }
                    const delay = Math.pow(2, retry) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
            throw new Error("TTS API 最终调用失败 (未知原因).");
        }

                textBlock.ondragstart = (e) => {
                    draggedOcrIndex = Number(textBlock.getAttribute('data-index'));
                    if (e.dataTransfer) {
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/plain', String(draggedOcrIndex));
                    }
                    textBlock.classList.add('opacity-60');
                };
                textBlock.ondragend = () => {
                    draggedOcrIndex = null;
                    textBlock.classList.remove('opacity-60');
                    textBlock.classList.remove('ring-2', 'ring-blue-400');
                };
                textBlock.ondragover = (e) => {
                    e.preventDefault();
                    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
                    textBlock.classList.add('ring-2', 'ring-blue-400');
                };
                textBlock.ondragleave = () => {
                    textBlock.classList.remove('ring-2', 'ring-blue-400');
                };
                textBlock.ondrop = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    textBlock.classList.remove('ring-2', 'ring-blue-400');
                    const fromStr = e.dataTransfer?.getData('text/plain') || '';
                    const from = draggedOcrIndex ?? Number(fromStr);
                    const targetIndex = Number(textBlock.getAttribute('data-index'));
                    if (!Number.isFinite(from) || !Number.isFinite(targetIndex)) return;
                    if (from < 0 || from >= ocrData.length) return;
                    if (targetIndex < 0 || targetIndex >= ocrData.length) return;

                    const rect = textBlock.getBoundingClientRect();
                    const after = e.clientY > rect.top + rect.height / 2;
                    let insertIndex = targetIndex + (after ? 1 : 0);

                    const [moved] = ocrData.splice(from, 1);
                    if (from < insertIndex) insertIndex -= 1;
                    insertIndex = Math.max(0, Math.min(insertIndex, ocrData.length));
                    ocrData.splice(insertIndex, 0, moved);
                    draggedOcrIndex = null;
                    applyOcrOrder(ocrData);
                    displayOCRText(ocrData);
                };

                ocrTextPanel.appendChild(textBlock);
            });
        }

        async function buildOcrDataFromCanvas(inputCanvas, progressText) {
            const base64Image = canvasToBase64(inputCanvas);
            const results = await callOpenRouterOCR(base64Image);
            if (results.length === 0) return [];

            if (progressText) {
                ocrTextPanel.innerHTML = `<p class="text-gray-500 italic">${progressText}</p>`;
            }

            const translationPromises = results.map(item => callOpenRouterTranslation(item.text).catch(err => {
                console.error("Translation failed for text:", item.text, err);
                return '自动翻译失败。';
            }));
            const translations = await Promise.all(translationPromises);

            let data = results.map((item, index) => ({
                ...item,
                translation: translations[index]
            }));

            data = data
                .map(item => {
                    const [x1, y1, x2, y2] = item.bbox || [0, 0, 0, 0];
                    const x_min = Math.max(0, Math.min(BBOX_NORM_SIZE, Math.min(x1, x2)));
                    const y_min = Math.max(0, Math.min(BBOX_NORM_SIZE, Math.min(y1, y2)));
                    const x_max = Math.max(0, Math.min(BBOX_NORM_SIZE, Math.max(x1, x2)));
                    const y_max = Math.max(0, Math.min(BBOX_NORM_SIZE, Math.max(y1, y2)));
                    return { ...item, bbox: [x_min, y_min, x_max, y_max] };
                })
                .sort((a, b) => {
                    const ay = a.bbox[1];
                    const by = b.bbox[1];
                    const dy = ay - by;
                    if (Math.abs(dy) > 12) return dy;
                    return a.bbox[0] - b.bbox[0];
                });
            applyOcrOrder(data);
            return data;
        }

        async function buildPageOcrData(pageNum) {
            const page = await pdfDoc.getPage(pageNum);
            const baseViewport = page.getViewport({ scale: 1 });
            let scale = 1200 / baseViewport.width;
            if (scale < 1) scale = 1;
            if (scale > 2.5) scale = 2.5;
            const viewport = page.getViewport({ scale });
            const offscreen = document.createElement('canvas');
            offscreen.width = viewport.width;
            offscreen.height = viewport.height;
            const offCtx = offscreen.getContext('2d');
            await page.render({ canvasContext: offCtx, viewport }).promise;
            return buildOcrDataFromCanvas(offscreen);
        }

        function loadScriptOnce(url) {
            return new Promise((resolve, reject) => {
                const existing = document.querySelector(`script[data-src="${url}"]`);
                if (existing) {
                    existing.addEventListener('load', resolve, { once: true });
                    existing.addEventListener('error', reject, { once: true });
                    if (window.XLSX) resolve();
                    return;
                }
                const s = document.createElement('script');
                s.src = url;
                s.async = true;
                s.setAttribute('data-src', url);
                s.onload = () => resolve();
                s.onerror = () => reject(new Error(`脚本加载失败: ${url}`));
                document.head.appendChild(s);
            });
        }

                'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
            ];
            let lastError = null;
            for (const url of urls) {
                try {

                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span>正在翻译所有识别的文本... (步骤 2/2)</span>
                        </div>
                    `;
                    
                    const translationPromises = results.map(item => callOpenRouterTranslation(item.text).catch(err => {
                        console.error("Translation failed for text:", item.text, err);
                        return '自动翻译失败。'; // Fallback text
                    }));

                    const translations = await Promise.all(translationPromises);

                    // 3. 组合结果
                    ocrData = results.map((item, index) => ({
                        ...item,
                        translation: translations[index]
                    }));
                }


                // 4. 显示和渲染标记
                ocrData = ocrData
                    .map(item => {
                        const [x1, y1, x2, y2] = item.bbox || [0, 0, 0, 0];
                        const x_min = Math.max(0, Math.min(BBOX_NORM_SIZE, Math.min(x1, x2)));
                        const y_min = Math.max(0, Math.min(BBOX_NORM_SIZE, Math.min(y1, y2)));
                        const x_max = Math.max(0, Math.min(BBOX_NORM_SIZE, Math.max(x1, x2)));
                        const y_max = Math.max(0, Math.min(BBOX_NORM_SIZE, Math.max(y1, y2)));
                        return { ...item, bbox: [x_min, y_min, x_max, y_max] };
                    })
                    .sort((a, b) => {
                        const ay = a.bbox[1];
                        const by = b.bbox[1];
                        const dy = ay - by;
                        if (Math.abs(dy) > 12) return dy;
                        return a.bbox[0] - b.bbox[0];
                    });
                applyOcrOrder(ocrData);
                displayOCRText(ocrData);
                ocrCacheByPage.set(currentPage, ocrData);
                
                if (ocrData.length > 0) {
                    clickOverlay.classList.add('hidden');
                    clickOverlay.style.pointerEvents = 'none'; 
                    await new Promise(requestAnimationFrame);
                }

            } catch (error) {
                console.error("OCR 或翻译提取失败:", error);
                ocrCacheByPage.delete(currentPage);
                
                // 文本面板显示错误信息
                ocrTextPanel.innerHTML = `<p class="text-red-500 font-semibold">OCR 或翻译失败: ${error.message}</p>`;

            } finally {
                ocrBtn.innerHTML = originalBtnHTML;
                ocrBtn.disabled = false; 
                updateNavigationButtons(); 
            }
        };


        /**
         * 集中处理 TTS、翻译和播放逻辑
         * @param {Array} matchedBbox - 匹配到的文本块的边界框 [x_min, y_min, x_max, y_max]
         * @param {string} matchedText - 匹配到的文本内容
         */
        async function processPlayback(matchedBbox, matchedText) {
            try {
                speakWithBrowserTTS(matchedText)
                    .then(() => {
                        stopPlaybackAndCleanup();
                    })
                    .catch((e) => {
                        console.error("TTS playback failed:", e);
                        stopPlaybackAndCleanup();
                    });

            } catch (error) {
                console.error("处理点击请求失败:", error);
                stopPlaybackAndCleanup();
            }
        }


        /**
         * 处理侧边栏文本块的点击事件
         */
        async function handleTextPanelClick(event, bbox, text) {
            stopPlaybackAndCleanup();
            await processPlayback(bbox, text);
        }

        // 监听键盘事件实现翻页
        document.addEventListener('keydown', (e) => {
            if (pdfDoc) {
                if (e.key === 'ArrowLeft' && currentPage > 1) {
                    goToPage(currentPage - 1);
                } else if (e.key === 'ArrowRight' && currentPage < pdfDoc.numPages) {
                    goToPage(currentPage + 1);
                }
            }
        });

    </script>

</body></html>
